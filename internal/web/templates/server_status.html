<div id="server-status" hx-get="/admin/server/status" hx-trigger="refresh from:body" hx-swap="outerHTML" class="grid grid-cols-3 gap-4 text-center">
    <div>
        <div class="text-2xl font-bold text-indigo-600">{{.RunningCount}}/{{.TotalCount}}</div>
        <div class="text-xs text-gray-500">Renderers Running</div>
    </div>
    <div>
        <div class="text-2xl font-bold text-green-600">{{.DeviceCount}}</div>
        <div class="text-xs text-gray-500">Available Devices</div>
    </div>
    <div>
        <div class="text-2xl font-bold text-blue-600">{{.PlayingCount}}</div>
        <div class="text-xs text-gray-500">Now Playing</div>
    </div>
</div>
