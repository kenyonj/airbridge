<div class="space-y-3" id="renderer-list">
{{range .Renderers}}
<div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border {{if .Running}}border-green-300{{else if .Enabled}}border-yellow-200{{else}}border-gray-200{{end}}">
    <div class="flex items-center space-x-4">
        <div class="w-3 h-3 rounded-full {{if .Running}}bg-green-500 animate-pulse{{else if .Enabled}}bg-yellow-500{{else}}bg-gray-400{{end}}"></div>
        <div>
            <div 
                class="font-medium text-gray-800 cursor-pointer hover:text-indigo-600 hover:underline"
                hx-get="/admin/renderers/{{.ID}}/edit"
                hx-target="closest div.flex.items-center.justify-between"
                hx-swap="outerHTML"
                title="Click to rename">
                {{.Name}}
            </div>
            <div class="text-sm text-gray-500">→ {{.AirPlayName}} (Port {{.Port}})</div>
            <div class="text-xs {{if .Running}}text-green-600{{else if .Enabled}}text-yellow-600{{else}}text-gray-400{{end}}">
                {{if .Running}}Running{{else if .Enabled}}Enabled (not running){{else}}Disabled{{end}}
            </div>
        </div>
    </div>
    <div class="flex items-center space-x-2">
        {{if .Running}}
        <button 
            hx-post="/admin/renderers/{{.ID}}/stop"
            hx-target="#renderer-list"
            hx-swap="outerHTML"
            class="px-3 py-1 text-sm bg-red-100 text-red-800 rounded hover:bg-red-200">
            Stop
        </button>
        <button 
            hx-post="/admin/renderers/{{.ID}}/restart"
            hx-target="#renderer-list"
            hx-swap="outerHTML"
            class="px-3 py-1 text-sm bg-blue-100 text-blue-800 rounded hover:bg-blue-200">
            Restart
        </button>
        {{else if .Enabled}}
        <button 
            hx-post="/admin/renderers/{{.ID}}/start"
            hx-target="#renderer-list"
            hx-swap="outerHTML"
            class="px-3 py-1 text-sm bg-green-100 text-green-800 rounded hover:bg-green-200">
            Start
        </button>
        {{end}}
        <button 
            hx-post="/admin/renderers/{{.ID}}/toggle"
            hx-target="#renderer-list"
            hx-swap="outerHTML"
            class="px-3 py-1 text-sm rounded {{if .Enabled}}bg-yellow-100 text-yellow-800 hover:bg-yellow-200{{else}}bg-green-100 text-green-800 hover:bg-green-200{{end}}">
            {{if .Enabled}}Disable{{else}}Enable{{end}}
        </button>
        <button 
            hx-delete="/admin/renderers/{{.ID}}"
            hx-target="#renderer-list"
            hx-swap="outerHTML"
            hx-confirm="Delete renderer '{{.Name}}'?"
            class="px-3 py-1 text-sm bg-red-100 text-red-800 rounded hover:bg-red-200">
            Delete
        </button>
    </div>
</div>
{{else}}
<div class="text-center py-8 text-gray-500">
    <p>No renderers configured yet.</p>
    <p class="text-sm">Create one from the available devices below.</p>
</div>
{{end}}
</div>
