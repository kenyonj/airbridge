<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Airbridge</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [hx-indicator] .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <h1 class="text-xl font-bold">🌉 Airbridge</h1>
                    <span class="text-indigo-200 text-sm">Anything → Everywhere</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="hover:text-indigo-200">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {{template "content" .}}
    </main>

    <footer class="text-center text-gray-500 text-sm py-4">
        Airbridge v{{.Version}} • <a href="https://github.com/kenyonj/airbridge" class="text-indigo-600 hover:underline">GitHub</a>
    </footer>

    <script>
        function copyToClipboard(btn, text) {
            // Try modern clipboard API first, fallback to execCommand
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopied(btn);
                }).catch(function() {
                    fallbackCopy(btn, text);
                });
            } else {
                fallbackCopy(btn, text);
            }
        }

        function fallbackCopy(btn, text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showCopied(btn) {
            var copyIcon = btn.querySelector('.copy-icon');
            var checkIcon = btn.querySelector('.check-icon');
            var copyText = btn.querySelector('.copy-text');
            
            copyIcon.classList.add('hidden');
            checkIcon.classList.remove('hidden');
            copyText.textContent = 'Copied!';
            
            setTimeout(function() {
                copyIcon.classList.remove('hidden');
                checkIcon.classList.add('hidden');
                copyText.textContent = 'Copy URL';
            }, 2000);
        }

        // WebSocket for live state updates
        (function() {
            var ws;
            var reconnectInterval = 1000;
            var maxReconnect = 30000;

            function connect() {
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(protocol + '//' + window.location.host + '/admin/ws');

                ws.onopen = function() {
                    console.log('WebSocket connected');
                    reconnectInterval = 1000;
                };

                ws.onmessage = function(event) {
                    var data = JSON.parse(event.data);
                    if (data.type === 'state_update') {
                        updateRendererState(data.renderer_id, data.transport_state, data.running);
                    }
                };

                ws.onclose = function() {
                    console.log('WebSocket disconnected, reconnecting in ' + reconnectInterval + 'ms');
                    setTimeout(connect, reconnectInterval);
                    reconnectInterval = Math.min(reconnectInterval * 2, maxReconnect);
                };

                ws.onerror = function(err) {
                    console.error('WebSocket error:', err);
                    ws.close();
                };
            }

            function updateRendererState(rendererId, transportState, running) {
                // Find renderer elements and update their state indicators
                var rendererList = document.getElementById('renderer-list');
                if (!rendererList) return;

                // Trigger HTMX refresh to get updated state
                htmx.trigger(rendererList, 'refresh');
            }

            // Start connection when page loads
            if (window.location.pathname.startsWith('/admin')) {
                connect();
            }
        })();
    </script>
</body>
</html>
