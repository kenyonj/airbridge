<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Airbridge</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [hx-indicator] .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M12.022,23.997l-0.002,-0c-1.104,-0 -2.001,0.897 -2.001,2.001c-0,1.105 0.897,2.002 2.001,2.002c1.105,0 2.002,-0.897 2.002,-2.002l0,-7.122c0,-0 6.001,-0.75 6.001,-0.75l0.003,3.867c-1.105,0 -2.002,0.897 -2.002,2.002c-0,1.105 0.897,2.002 2.002,2.002c1.104,-0 2.001,-0.897 2.001,-2.002l-0.005,-7.003c-0,-0.286 -0.123,-0.559 -0.338,-0.749c-0.215,-0.189 -0.501,-0.278 -0.786,-0.242l-8,1c-0.5,0.062 -0.876,0.488 -0.876,0.992l0,6.004Z"/><path d="M8.951,14.98c1.811,-1.82 4.318,-2.947 7.086,-2.947c2.755,0 5.251,1.117 7.06,2.921c0.391,0.39 1.025,0.39 1.414,-0.001c0.39,-0.391 0.389,-1.025 -0.001,-1.414c-2.171,-2.166 -5.167,-3.506 -8.473,-3.506c-3.322,0 -6.33,1.352 -8.503,3.536c-0.39,0.391 -0.388,1.025 0.003,1.414c0.391,0.389 1.025,0.388 1.414,-0.003Z"/><path d="M4.975,10.074c2.972,-2.545 6.832,-4.083 11.048,-4.083c4.203,-0 8.052,1.528 11.02,4.059c0.42,0.358 1.051,0.308 1.409,-0.112c0.359,-0.42 0.308,-1.052 -0.112,-1.41c-3.317,-2.829 -7.619,-4.537 -12.317,-4.537c-4.713,-0 -9.027,1.719 -12.349,4.564c-0.419,0.359 -0.468,0.99 -0.109,1.41c0.359,0.419 0.991,0.468 1.41,0.109Z"/></svg>
                        <h1 class="text-xl font-bold">Airbridge</h1>
                    </div>
                    <span class="text-indigo-200 text-sm">Anything → Everywhere</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="hover:text-indigo-200">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {{template "content" .}}
    </main>

    <footer class="text-center text-gray-500 text-sm py-4">
        Airbridge v{{.Version}} • <a href="https://github.com/kenyonj/airbridge" class="text-indigo-600 hover:underline">GitHub</a>
    </footer>

    <script>
        function copyToClipboard(btn, text) {
            // Try modern clipboard API first, fallback to execCommand
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopied(btn);
                }).catch(function() {
                    fallbackCopy(btn, text);
                });
            } else {
                fallbackCopy(btn, text);
            }
        }

        function fallbackCopy(btn, text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showCopied(btn) {
            var copyIcon = btn.querySelector('.copy-icon');
            var checkIcon = btn.querySelector('.check-icon');
            var copyText = btn.querySelector('.copy-text');
            
            copyIcon.classList.add('hidden');
            checkIcon.classList.remove('hidden');
            copyText.textContent = 'Copied!';
            
            setTimeout(function() {
                copyIcon.classList.remove('hidden');
                checkIcon.classList.add('hidden');
                copyText.textContent = 'Copy URL';
            }, 2000);
        }

        // WebSocket for live state updates
        (function() {
            var ws;
            var reconnectInterval = 1000;
            var maxReconnect = 30000;

            function connect() {
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(protocol + '//' + window.location.host + '/admin/ws');

                ws.onopen = function() {
                    console.log('WebSocket connected');
                    reconnectInterval = 1000;
                };

                ws.onmessage = function(event) {
                    var data = JSON.parse(event.data);
                    if (data.type === 'state_update') {
                        updateRendererState(data.renderer_id, data.transport_state, data.running);
                    } else if (data.type === 'renderer_changed') {
                        handleRendererChange(data.renderer_id, data.action);
                    }
                };

                ws.onclose = function() {
                    console.log('WebSocket disconnected, reconnecting in ' + reconnectInterval + 'ms');
                    setTimeout(connect, reconnectInterval);
                    reconnectInterval = Math.min(reconnectInterval * 2, maxReconnect);
                };

                ws.onerror = function(err) {
                    console.error('WebSocket error:', err);
                    ws.close();
                };
            }

            function updateRendererState(rendererId, transportState, running) {
                // Find renderer elements and update their state indicators
                var rendererList = document.getElementById('renderer-list');
                if (!rendererList) return;

                // Trigger HTMX refresh to get updated state
                htmx.trigger(rendererList, 'refresh');
            }

            function handleRendererChange(rendererId, action) {
                // Refresh renderer section (includes count)
                var rendererSection = document.getElementById('renderer-section');
                if (rendererSection) {
                    htmx.trigger(rendererSection, 'refresh');
                }

                // Refresh available devices list (to update configured status)
                var deviceList = document.getElementById('device-list');
                if (deviceList) {
                    htmx.trigger(deviceList, 'refresh');
                }

                // Refresh server status (to update counts)
                var serverStatus = document.getElementById('server-status');
                if (serverStatus) {
                    htmx.trigger(serverStatus, 'refresh');
                }
            }

            // Start connection when page loads
            if (window.location.pathname.startsWith('/admin')) {
                connect();
            }
        })();
    </script>
</body>
</html>
