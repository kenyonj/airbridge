    <style>
        [hx-indicator] .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
        
        /* Audio equalizer animation */
        @keyframes eq-bar {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .animate-eq-1 { animation: eq-bar 0.8s ease-in-out infinite; animation-delay: 0.0s; }
        .animate-eq-2 { animation: eq-bar 0.6s ease-in-out infinite; animation-delay: 0.1s; }
        .animate-eq-3 { animation: eq-bar 0.9s ease-in-out infinite; animation-delay: 0.05s; }
        .animate-eq-4 { animation: eq-bar 0.7s ease-in-out infinite; animation-delay: 0.15s; }
        .animate-eq-5 { animation: eq-bar 0.8s ease-in-out infinite; animation-delay: 0.08s; }
        .animate-eq-6 { animation: eq-bar 0.65s ease-in-out infinite; animation-delay: 0.2s; }
        .animate-eq-7 { animation: eq-bar 0.75s ease-in-out infinite; animation-delay: 0.12s; }
        
        /* Modern volume slider */
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #8b5cf6 0%, #ec4899 var(--volume-pct, 50%), #e5e7eb var(--volume-pct, 50%), #e5e7eb 100%);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .volume-slider:hover {
            height: 8px;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2), 0 0 0 2px #8b5cf6;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .volume-slider:hover::-webkit-slider-thumb {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 0 3px #8b5cf6;
        }
        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2), 0 0 0 2px #8b5cf6;
            cursor: pointer;
        }
        .volume-slider::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: #e5e7eb;
        }
    </style>

    <script>
        function copyToClipboard(btn, text) {
            // Try modern clipboard API first, fallback to execCommand
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopied(btn);
                }).catch(function() {
                    fallbackCopy(btn, text);
                });
            } else {
                fallbackCopy(btn, text);
            }
        }

        function fallbackCopy(btn, text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showCopied(btn) {
            var copyIcon = btn.querySelector('.copy-icon');
            var checkIcon = btn.querySelector('.check-icon');
            var copyText = btn.querySelector('.copy-text');
            
            copyIcon.classList.add('hidden');
            checkIcon.classList.remove('hidden');
            copyText.textContent = 'Copied!';
            
            setTimeout(function() {
                copyIcon.classList.remove('hidden');
                checkIcon.classList.add('hidden');
                copyText.textContent = 'Copy URL';
            }, 2000);
        }

        // WebSocket for live state updates
        (function() {
            var ws;
            var reconnectInterval = 1000;
            var maxReconnect = 30000;

            function connect() {
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(protocol + '//' + window.location.host + '/admin/ws');

                ws.onopen = function() {
                    console.log('WebSocket connected');
                    reconnectInterval = 1000;
                };

                ws.onmessage = function(event) {
                    var data = JSON.parse(event.data);
                    if (data.type === 'state_update') {
                        updateRendererState(data.renderer_id, data.transport_state, data.running);
                    } else if (data.type === 'renderer_changed') {
                        handleRendererChange(data.renderer_id, data.action);
                    } else if (data.type === 'volume_update') {
                        updateRendererVolume(data.renderer_id, data.volume, data.muted);
                    }
                };

                ws.onclose = function() {
                    console.log('WebSocket disconnected, reconnecting in ' + reconnectInterval + 'ms');
                    setTimeout(connect, reconnectInterval);
                    reconnectInterval = Math.min(reconnectInterval * 2, maxReconnect);
                };

                ws.onerror = function(err) {
                    console.error('WebSocket error:', err);
                    ws.close();
                };
            }

            var refreshTimeout = null;
            function updateRendererState(rendererId, transportState, running) {
                // Debounce rapid state updates (STOPPED → TRANSITIONING → PLAYING)
                if (refreshTimeout) {
                    clearTimeout(refreshTimeout);
                }
                
                refreshTimeout = setTimeout(function() {
                    var rendererSection = document.getElementById('renderer-section');
                    if (!rendererSection) return;
                    htmx.trigger(rendererSection, 'refresh');
                }, 100);
            }

            function handleRendererChange(rendererId, action) {
                // Refresh renderer section (includes count)
                var rendererSection = document.getElementById('renderer-section');
                if (rendererSection) {
                    htmx.trigger(rendererSection, 'refresh');
                }

                // Refresh available devices list (to update configured status)
                var deviceList = document.getElementById('device-list');
                if (deviceList) {
                    htmx.trigger(deviceList, 'refresh');
                }

                // Refresh server status (to update counts)
                var serverStatus = document.getElementById('server-status');
                if (serverStatus) {
                    htmx.trigger(serverStatus, 'refresh');
                }
            }

            function updateRendererVolume(rendererId, volume, muted) {
                // Find all volume sliders for this renderer and update them
                var sliders = document.querySelectorAll('input[hx-post*="/admin/renderers/' + rendererId + '/volume"]');
                sliders.forEach(function(slider) {
                    slider.value = volume;
                    slider.style.setProperty('--volume-pct', volume + '%');
                    // Update the percentage label
                    var label = slider.nextElementSibling;
                    if (label) {
                        label.textContent = volume + '%';
                    }
                });
            }

            // Start connection when page loads
            if (window.location.pathname.startsWith('/admin')) {
                connect();
            }
        })();
    </script>
