# Airbridge configuration example
# Place this file at config.yaml or ~/.config/airbridge/config.yaml

# HTTP port for the first renderer (subsequent renderers use incremental ports)
http_port: 8200

# Enable automatic discovery of AirPlay devices
# When true, a DLNA renderer is created for each discovered device
auto_discover: true

# Prefix for DLNA friendly names (e.g., "Airbridge (Kitchen)")
name_prefix: "Airbridge"

# Optional: Filter to only include specific devices
# Leave empty to include all discovered devices
# device_filter:
#   - "Kitchen"
#   - "Living Room"
#   - "Guest Bedroom"

# Optional: Device-specific configuration
# These override auto-discovered settings
devices:
  # Example: Custom alias for a device
  # - name: "Kitchen"
  #   alias: "Kitchen Bridge"
  #   port: 8201

  # Example: Exclude a device from auto-discovery
  # - name: "Office"
  #   enabled: false

  # Example: Set default volume
  # - name: "Guest Bedroom"
  #   volume: 60
